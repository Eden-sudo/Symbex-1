; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; El framework Arduino compila con -Os (optimiza TAMANO). Para medir
; velocidad usamos -O2, igual que en x86. Si algo falla, borra estas
; dos lineas y vuelve a -Os.
build_unflags = -Os
build_flags =
    -DBOARD_HAS_PSRAM
    -O2

; Same board, with the PIE multiplier kernel (ee.xorq + ee.vmulas) for symbex_xnor_popcount.
; Only data aligned to 16 bytes takes it (SYMBEX_ALIGN16); the rest keeps the default path.
[env:esp32-s3-devkitc-1-pie]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DSYMBEX_USE_PIE
