# CDT configuration of the cnn_cifar_resnet8 benchmark: a fully binary ResNet-8 (method "boolean"), trained from scratch.
# resnet8_symbex.py writes a copy per width and seed into runs/ (model definition and starting weights filled in).
[model]
file = "models/bool_resnet8_x1_init.pth"     # random starting weights (model.initial_weights): trained from scratch
definition = "model.py:BoolResNet8x1"         # BoolResNet8x2 for twice the channels
method = "boolean"

[data]
directory = "../data/cifar10"
format = "cifar10"
mean = []                                     # the network takes the pixels themselves (thermometer)
std = []

[training]
epochs = 150
learning_rate = 0.005
batch_size = 128
distill = false                               # labels only (the premise of the benchmarks)
seed = 42

[output]
verbose = true
lib_path = "../../Symbex1_PIO/lib/lib_symbex"
validation_samples = 2000

[chip]
samples = 1000
popcount = "swar"                             # the minimum-RAM counting mode, as the other benchmarks
