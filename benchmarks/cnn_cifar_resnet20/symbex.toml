# cnn_cifar_resnet20 benchmark -- CDT configuration (paths relative to benchmarks/cnn_cifar_resnet20/).
# Run it through cifar_symbex.py. Only the training is measured here (the CDT does not export convolutional
# networks yet): how much of a published model the binary version recovers, and which knowledge it keeps.

[model]
file       = "models/resnet20_cifar10.pth"
definition = "model.py:ResNet20"
method     = "plain"

[data]
directory           = "../data/cifar10"
format              = "cifar10"                # torchvision; the 10,000 test images are the validation set
calibration_samples = 64
mean = [0.4914, 0.4822, 0.4465]                # the normalization the published model was trained with
std  = [0.2023, 0.1994, 0.2010]

[hardware]
ram_kb   = 512
flash_kb = 8192
psram_kb = 0
cpu_bits = 32

[target]
budget            = 1.0                        # no memory limit here: the question is accuracy, not fitting a chip
tolerance         = 0.99
options           = ["bin"]                    # every layer at 1 bit (the first layer keeps its real input)
max_accuracy_drop = 100.0
search_epochs     = 1                          # one width only: the search is a formality
widths            = [1.0]                      # the same architecture as the published model

[training]
epochs     = 60
distill    = true
batch_size = 256
checkpoint = "last"
seed       = 42
data_on_gpu = true                             # CIFAR-10 fits in VRAM (~740 MB): no data loading per epoch

[output]
directory      = "runs/symbex"
verbose        = true
lib_path       = "../../Symbex1_PIO/lib/lib_symbex"
int8_reference = false

[run]
to = "train"
