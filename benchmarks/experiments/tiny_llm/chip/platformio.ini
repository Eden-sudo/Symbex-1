; tiny_llm on the ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM), native USB port. Driven by ../chip_run.py, which
; writes src/check_data.h, builds, writes model.bin to the "model" partition and reads the results.
[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
; lib_symbex for its PIE int8 row products (symbex_s8_dot_rows, the output head)
lib_extra_dirs = ../../../../Symbex1_PIO/lib
lib_deps = lib_symbex
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
