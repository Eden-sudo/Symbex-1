; tiny_llm on the ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM), native USB port. Driven by ../chip_run.py, which
; writes src/check_data.h, builds, writes model.bin to the "model" partition and reads the results.
; Platforms pinned (#210): espressif32@7.1.3 = Arduino-ESP32 2.0.17 / ESP-IDF 4.4, the core of every result here;
; espressif32 8.0.0 (Arduino 3.3, IDF 5.5) ran the ESP32 260K exact but 6 % slower per token (window mean).
[env:s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
; lib_symbex for its PIE int8 row products (symbex_s8_dot_rows, the output head)
lib_extra_dirs = ../../../../Symbex1_PIO/lib
lib_deps = lib_symbex
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
