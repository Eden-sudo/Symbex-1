; tiny_llm on chips without PSRAM: the classic ESP32 (esp32dev) and the Raspberry Pi Pico 2 (RP2350, Cortex-M33 or
; Hazard3). model.bin is a const array in flash (src/model_data.h), the KV cache and the buffers in internal RAM.
; Driven by ../chip_run.py --board esp32|pico2_arm|pico2_riscv, which writes src/check_data.h and src/model_data.h.
; Platforms pinned (#210): espressif32@7.1.3 = Arduino-ESP32 2.0.17 / ESP-IDF 4.4, the core of every result here;
; espressif32 8.0.0 (Arduino 3.3, IDF 5.5) ran the ESP32 260K exact but 6 % slower per token (window mean).
[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -Os
build_flags = -O2 -DTINYLM_KV_SPLIT

[env:pico2_arm]
platform = raspberrypi@1.20.0
board = rpipico2
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
build_unflags = -Os
build_flags = -O2 -DTINYLM_KV_SPLIT

[env:pico2_riscv]
platform = raspberrypi@1.20.0
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.mcu = rp2350-riscv
upload_protocol = picotool
build_unflags = -Os
build_flags = -O2 -DTINYLM_KV_SPLIT
