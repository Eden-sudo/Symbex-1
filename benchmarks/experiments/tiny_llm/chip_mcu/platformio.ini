; tiny_llm on chips without PSRAM: the classic ESP32 (esp32dev) and the Raspberry Pi Pico 2 (RP2350, Cortex-M33 or
; Hazard3). model.bin is a const array in flash (src/model_data.h), the KV cache and the buffers in internal RAM.
; Driven by ../chip_run.py --board esp32|pico2_arm|pico2_riscv, which writes src/check_data.h and src/model_data.h.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -Os
build_flags = -O2 -DTINYLM_KV_SPLIT

[env:pico2_arm]
platform = raspberrypi
board = rpipico2
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
build_unflags = -Os
build_flags = -O2 -DTINYLM_KV_SPLIT

[env:pico2_riscv]
platform = raspberrypi
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.mcu = rp2350-riscv
upload_protocol = picotool
build_unflags = -Os
build_flags = -O2 -DTINYLM_KV_SPLIT
