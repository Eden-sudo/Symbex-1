; llama2.c's run.c (fp32, unchanged) on chips without PSRAM: the comparison point of the binary 260K (../chip_mcu/).
; Same boards and -O2 as chip_mcu; the checkpoint (1.06 MB) needs the ESP32's 3 MB app partition. Driven by
; ../chip_fp32.py --board esp32|pico2_arm|pico2_riscv, which writes src/gen_data.h and src/model_data.h.
; Platforms pinned (#210): espressif32@7.1.3 = Arduino-ESP32 2.0.17 / ESP-IDF 4.4, the core of every result here;
; espressif32 8.0.0 (Arduino 3.3, IDF 5.5) ran the ESP32 260K exact but 6 % slower per token (window mean).
[env]
build_unflags = -Os
build_flags = -O2 -Illama2c

[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

[env:pico2_arm]
platform = raspberrypi@1.20.0
board = rpipico2
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool

[env:pico2_riscv]
platform = raspberrypi@1.20.0
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.mcu = rp2350-riscv
upload_protocol = picotool
