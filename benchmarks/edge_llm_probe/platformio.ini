; Edge-LLM probe: memory bandwidth per tier, cycles per weight of 1-bit GEMV kernels, energy schedule, camera smoke test.
; Build:  pio run -e esp32s3            (or esp32cam)
; Flash:  pio run -e esp32s3 -t upload -t monitor
; See README.md for wiring, the ESP32-CAM flashing procedure and how to save the log.
;
; The platform is pinned to the official espressif32 6.13.0 (Arduino core 2.0.17, ESP-IDF 4.4): main.cpp uses the
; esp_partition_mmap / SD_MMC / esp32-camera APIs of that release.

[platformio]
default_envs = esp32s3

[probe]
; Every PROBE_* macro below is documented in src/probe_config.h with its default.
framework = arduino
platform = espressif32@6.13.0
monitor_speed = 115200
board_build.partitions = partitions_probe.csv
; The Arduino framework compiles with -Os (size). The kernels are timed with -O2, like the rest of SYMBEX.
build_unflags = -Os
; the kernels are portable C99 shared with the host tests (tests/test_edge_llm_kernels.py)
build_src_filter =
    +<*>
    +<../kernels/onebit_gemv.c>
build_flags =
    -O2
    -I$PROJECT_DIR/kernels
    ; seconds per phase of the energy schedule (a USB meter needs >= 20 s to settle)
    -DPROBE_PHASE_SECONDS=20
    ; GPIO driven high during every non-idle phase (scope / logic analyser sync); -1 = disabled
    -DPROBE_MARKER_GPIO=-1
    ; CPU clock the probe sets at boot (MHz); the cycle counts below are at this clock
    -DPROBE_CPU_MHZ=240

[env:esp32s3]
extends = probe
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
; The board definition says 8 MB. If your board has 16 MB, add: board_upload.flash_size = 16MB
; (the partition table needs only 4 MB). The flash size reported by the probe is the real chip size.
build_flags =
    ${probe.build_flags}
    -DBOARD_HAS_PSRAM
    ; SD_MMC pins, 1-bit mode (Freenove ESP32-S3-WROOM CAM / ESP32-S3-EYE style boards: CLK 39, CMD 38, D0 40)
    -DPROBE_SD_CLK=39
    -DPROBE_SD_CMD=38
    -DPROBE_SD_D0=40
    ; camera pin map: PROBE_CAMERA_ESP32S3_EYE | PROBE_CAMERA_AI_THINKER | PROBE_CAMERA_NONE
    -DPROBE_CAMERA_ESP32S3_EYE
    ; Serial goes to UART0 (the USB-UART bridge port). For the native USB port add:
    ;   -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_devkit]
; ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM) with no SD slot and no camera; the log goes to the native
; USB port (/dev/ttyACM0), which needs no BOOT button to flash.
;   pio run -e esp32s3_devkit -t upload && python parse_log.py --port /dev/ttyACM0 --duration 600
extends = probe
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
build_flags =
    ${probe.build_flags}
    -DBOARD_HAS_PSRAM
    -DPROBE_SD_CLK=-1
    -DPROBE_CAMERA_NONE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32cam]
extends = probe
board = esp32cam
board_build.partitions = partitions_probe.csv
build_flags =
    ${probe.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; the classic ESP32 has a fixed SDMMC slot: no pin flags; the probe tests 1-bit and 4-bit modes
    -DPROBE_CAMERA_AI_THINKER
