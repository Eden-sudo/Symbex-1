# mlp_fashion benchmark -- CDT configuration (paths relative to benchmarks/mlp_fashion/).
# Run it through fashion_symbex.py, which trains the FP32 model first if it is missing.

[model]
file       = "models/fashion_mlp.pth"
definition = "modelo.py:FashionMLP"            # the .pth holds only the weights
method     = "plain"

[data]
directory           = "../data/fashionmnist"
format              = "fashionmnist"           # torchvision, downloaded if missing
validation_split    = 0.1
calibration_samples = 64
mean = [0.2860]                                # same normalization the model was trained with
std  = [0.3530]

[hardware]
ram_kb   = 320                                 # ESP32 (classic)
flash_kb = 4096
psram_kb = 0
cpu_bits = 32

[target]
budget            = 0.25
tolerance         = 0.99
options           = ["bin"]                    # this benchmark: every layer at 1 bit
max_accuracy_drop = 2.0
search_epochs     = 5
widths            = [1.0, 1.5, 2.0]

[training]
epochs     = 15
distill    = true
checkpoint = "last"
seed       = 42

[output]
directory          = "runs/symbex"
verbose            = true
lib_path           = "../../Symbex1_PIO/lib/lib_symbex"
validation_samples = 2000

[chip]
board    = ""                                  # set by fashion_symbex.py --board
port     = "/dev/ttyUSB0"
samples  = 1000
popcount = "swar"
