# mlp_digits benchmark -- CDT configuration (paths relative to benchmarks/mlp/mlp_digits/).
# Run it through digits_symbex.py, which prepares the data and trains the FP32 model first if they are missing.
# Target: the Arduino Uno (ATmega328P: 8 bits, 16 MHz, 2 KB of RAM, 32 KB of flash); the ESP32 boards as a comparison.

[model]
file       = "models/digits_mlp.pth"
definition = "model.py:DigitsMLP"
method     = "plain"

[data]
directory           = "../../data/digits"
format              = "npy"                    # x.npy (uint8, 8x8), y.npy, val.npy (the 360 test images)
calibration_samples = 64
mean = [0.3060]
std  = [0.3762]

[hardware]
ram_kb   = 2                                   # Arduino Uno
flash_kb = 32
psram_kb = 0
cpu_bits = 8

[target]
budget            = 0.5                        # up to 16 KB of flash and 1 KB of RAM for the model
tolerance         = 0.99
options           = ["bin"]                    # every layer at 1 bit
max_accuracy_drop = 1.0
search_epochs     = 30
widths            = [2.0]                      # the benchmark model: hidden layer x2 (64 -> 256 -> 10)

[training]
epochs     = 150
distill    = true
batch_size = 64
checkpoint = "last"
seed       = 42

[output]
directory          = "runs/symbex"
verbose            = true
lib_path           = "../../../Symbex1_PIO/lib/lib_symbex"
validation_samples = 360
arithmetic         = "auto"
int8_reference     = false

[chip]
board    = ""
port     = "/dev/ttyUSB0"
samples  = 360
popcount = "swar"
weights  = "flash"
