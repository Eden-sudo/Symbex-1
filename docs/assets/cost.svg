<circle cx="514.6" cy="165.4" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>ResNet-8, CIFAR-10 · ESP32: 11.35× faster, INT8 87.0 vs SYMBEX 71.3 (accuracy)</title></circle>
<text x="514.6" y="183.4" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">11.3×</text>
<text x="134.5" y="156.4" fill="#0b0b0b" font-size="12" text-anchor="start" font-weight="normal">ResNet-8, CIFAR-10 · accuracy: SYMBEX 71.3 %, INT8 87.0 %</text>
<line x1="468.6" y1="312.3" x2="674.9" y2="312.3" stroke="#2a78d6" stroke-width="2" stroke-opacity="0.5"/>
<circle cx="468.6" cy="312.3" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>MLP, Fashion-MNIST · ESP32: 8.77× faster, INT8 89.8 vs SYMBEX 87.5 (accuracy)</title></circle>
<text x="468.6" y="330.3" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">8.77×</text>
<circle cx="674.9" cy="312.3" r="4" fill="#ffffff" stroke="#2a78d6" stroke-width="2"><title>MLP, Fashion-MNIST · ESP32-S3: 27.79× faster, INT8 89.8 vs SYMBEX 87.5 (accuracy)</title></circle>
