<text x="383.6" y="303.3" fill="#0b0b0b" font-size="12" text-anchor="start" font-weight="normal">MLP, Fashion-MNIST · accuracy: SYMBEX 87.5 %, INT8 89.8 %</text>
<circle cx="207.0" cy="349.0" r="4" fill="#ffffff" stroke="#2a78d6" stroke-width="2"><title>FOMO, person detection · ESP32-S3: 2.03× faster, INT8 30.2 vs SYMBEX 31.2 (F1)</title></circle>
<text x="207.0" y="367.0" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">2.03×</text>
<text x="217.0" y="354.0" fill="#0b0b0b" font-size="12" text-anchor="start" font-weight="normal">FOMO, person detection · F1: SYMBEX 31.2 %, INT8 30.2 %</text>
<line x1="163.4" y1="366.2" x2="544.0" y2="366.2" stroke="#2a78d6" stroke-width="2" stroke-opacity="0.5"/>
<circle cx="163.4" cy="366.2" r="4" fill="#ffffff" stroke="#2a78d6" stroke-width="2"><title>ECG beats, large 1D net · ESP32-S3: 1.59× faster, INT8 72.4 vs SYMBEX 75.0 (balanced accuracy)</title></circle>
<text x="163.4" y="384.2" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">1.59×</text>
<circle cx="544.0" cy="366.2" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><title>ECG beats, large 1D net · ESP32: 13.37× faster, INT8 72.4 vs SYMBEX 75.0 (balanced accuracy)</title></circle>
<text x="544.0" y="384.2" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">13.4×</text>
<text x="119.4" y="399.2" fill="#0b0b0b" font-size="12" text-anchor="start" font-weight="normal">ECG beats, large 1D net · balanced accuracy: SYMBEX 75.0 %, INT8 72.4 %</text>
</svg>
