<text x="780.0" y="464.0" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">50×</text>
<text x="430.0" y="484.0" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">times faster than TFLite Micro INT8 (log scale)</text>
<text x="16.0" y="108.0" fill="#52514e" font-size="11" text-anchor="start" font-weight="normal">points lost (INT8 − SYMBEX)</text>
