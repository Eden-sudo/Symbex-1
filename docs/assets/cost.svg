<text x="368.0" y="464.0" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">5×</text>
<line x1="492.0" y1="118" x2="492.0" y2="448" stroke="#e4e3df"/>
<text x="492.0" y="464.0" fill="#52514e" font-size="11" text-anchor="middle" font-weight="normal">10×</text>
